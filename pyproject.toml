[project]
name = "finn-agent"
version = "0.1.0"
description = "Finn – Covenant-Prüfung per E-Mail"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.6.0",
    "imap-tools>=1.16.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "tnefparse>=1.4.0",
]

[project.scripts]
finn-agent = "finn.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finn"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
